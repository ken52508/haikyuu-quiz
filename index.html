<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>你有多懂排球少年？</title>
<meta name="description" content="10 題排球少年問答挑戰，看看你有多懂烏野高校排球部。">

<meta property="og:title" content="你有多懂排球少年？">
<meta property="og:description" content="10 題排球少年問答挑戰，看看你有多懂烏野高校排球部。">
<meta name="theme-color" content="#16130e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%AE</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-C77ELCKPVB"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-C77ELCKPVB');</script>
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
/* 版型沿用「台灣人必答常識題」：1:1 計程車黃方框；題號列 → 圖片＋題目 → 2×2 選項 → 解說＋按鈕。只有背景色可以切換。 */
:root{
  color-scheme: dark;
  --page:#16130e;
  --board:#ff9a3c;
  --ink:#17140f;
  --paper:#fffaf0;
  --ok:#1f9d55;
  --bad:#e5484d;
  --soft:color-mix(in oklab, var(--ink) 58%, var(--board));
  --tb-bg:#221d15; --tb-line:#3a3326; --tb-fg:#fffaf0; --tb-muted:#a99d84;
  --round:'Huninn', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  --sans:'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
}
html,body{height:100%}
body{background:var(--page); color:var(--tb-fg); font-family:var(--sans); overflow:hidden; transition:background .25s;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--board); outline-offset:3px}

.app{height:100%; display:grid; grid-template-rows:1fr auto; gap:12px; padding-block:14px}
.cell{container-type:size; min-height:0; display:grid; place-items:center}
.board{
  --u:calc(min(100cqw, 100cqh) / 100);
  position:relative; width:min(100cqw, 100cqh); aspect-ratio:1/1; max-width:100%;
  background:var(--board); color:var(--ink); border-radius:calc(var(--u)*3); overflow:hidden;
  padding:calc(var(--u)*4.5); display:flex; flex-direction:column; gap:calc(var(--u)*2.6);
  user-select:none;
}
.board::before{content:""; position:absolute; inset:0; pointer-events:none; opacity:.09;
  background-image:linear-gradient(var(--ink) 1px, transparent 1px), linear-gradient(90deg, var(--ink) 1px, transparent 1px);
  background-size:calc(var(--u)*5) calc(var(--u)*5)}
.board > *{position:relative}

.head{display:flex; align-items:center; justify-content:space-between; gap:calc(var(--u)*2)}
.pill{font-weight:900; font-size:calc(var(--u)*3.4); font-variant-numeric:tabular-nums;
  background:var(--ink); color:var(--board); padding:calc(var(--u)*.9) calc(var(--u)*2.6); border-radius:99px; letter-spacing:.04em}
.score{font-weight:700; font-size:calc(var(--u)*3.2); font-variant-numeric:tabular-nums}
.score b{font-weight:900; font-size:1.25em}

.main{display:grid; grid-template-columns:calc(var(--u)*31) 1fr; gap:calc(var(--u)*4); align-items:center; flex:1; min-height:0}
.pic{position:relative; aspect-ratio:1/1; width:100%; background:var(--paper); border:calc(var(--u)*.7) solid var(--ink); border-radius:calc(var(--u)*3);
  box-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 var(--ink); overflow:hidden; display:grid; place-items:center}
.pic img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 25%}
.glyph{font-family:var(--round); font-size:calc(var(--u)*17); line-height:1}
.board[data-mode="play"] .pic.editable{cursor:pointer}
.pic .swap{position:absolute; left:50%; bottom:calc(var(--u)*1.4); transform:translateX(-50%); white-space:nowrap; font-size:calc(var(--u)*2.3); font-weight:900;
  background:var(--ink); color:var(--board); padding:calc(var(--u)*.5) calc(var(--u)*1.6); border-radius:99px; opacity:0; transition:opacity .15s}
.pic.editable:hover .swap{opacity:1}
body.rec .pic .swap{display:none}
.pic .need{position:absolute; left:0; right:0; bottom:calc(var(--u)*1.6); font-size:calc(var(--u)*2.3); font-weight:700; color:var(--soft); text-align:center}
.q{min-width:0}
.tags{display:flex; flex-wrap:wrap; gap:calc(var(--u)*1.2); margin-bottom:calc(var(--u)*1.6)}
.tag{display:inline-block; font-size:calc(var(--u)*2.6); font-weight:700; letter-spacing:.12em; padding:calc(var(--u)*.4) calc(var(--u)*1.6);
  border:calc(var(--u)*.45) solid var(--ink); border-radius:99px}
.tag.cat{background:var(--ink); color:var(--board)}
.qtext{font-family:var(--round); font-size:calc(var(--u)*5.6); line-height:1.28; text-wrap:balance; margin:0}

.opts{display:grid; grid-template-columns:1fr 1fr; gap:calc(var(--u)*2.4)}
.opt{display:flex; align-items:center; gap:calc(var(--u)*2); text-align:left; min-height:calc(var(--u)*13);
  background:var(--paper); border:calc(var(--u)*.6) solid var(--ink); border-radius:calc(var(--u)*2.4);
  box-shadow:calc(var(--u)*.8) calc(var(--u)*.8) 0 var(--ink); padding:calc(var(--u)*1.6) calc(var(--u)*2.2);
  font-weight:700; font-size:calc(var(--u)*3.9); line-height:1.25; transition:transform .08s, box-shadow .08s, background .15s, opacity .15s}
.opt:hover{transform:translate(calc(var(--u)*-.2), calc(var(--u)*-.2))}
.opt:active{transform:translate(calc(var(--u)*.6), calc(var(--u)*.6)); box-shadow:calc(var(--u)*.2) calc(var(--u)*.2) 0 var(--ink)}
.opt .k{flex:none; display:grid; place-items:center; width:calc(var(--u)*6.4); height:calc(var(--u)*6.4); border-radius:50%;
  background:var(--ink); color:var(--board); font-weight:900; font-size:calc(var(--u)*3.4)}
.opt .t{min-width:0}
.opt.pick{background:var(--ink); color:var(--board)}
.opt.pick .k{background:var(--board); color:var(--ink)}
.board.done .opt{cursor:default; transform:none}
.board.done .opt:not(.right):not(.wrong){opacity:.42}
.opt.right{background:var(--ok); color:#fff}
.opt.right .k{background:#fff; color:var(--ok)}
.opt.wrong{background:var(--bad); color:#fff}
.opt.wrong .k{background:#fff; color:var(--bad)}
.board.done .opt.right{animation:pop .28s ease-out}
.board.done .opt.wrong{animation:shake .3s}
@keyframes pop{40%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(calc(var(--u)*-1))}75%{transform:translateX(calc(var(--u)*1))}}

.foot{display:grid; grid-template-columns:1fr auto; align-items:center; gap:calc(var(--u)*3); min-height:calc(var(--u)*12.5)}
.fact{font-size:calc(var(--u)*3.15); line-height:1.45; font-weight:500; min-width:0}
.fact strong{font-family:var(--round); font-weight:400; font-size:1.18em; display:block; margin-bottom:calc(var(--u)*.3)}
.fact .hint{color:var(--soft); font-weight:700}
.next{border:0; border-radius:99px; background:var(--ink); color:var(--board); font-weight:900; font-size:calc(var(--u)*4.2);
  padding:calc(var(--u)*2.6) calc(var(--u)*5); letter-spacing:.06em; white-space:nowrap; text-decoration:none; display:inline-flex; align-items:center; justify-content:center}
.next:active{transform:scale(.97)}

/* 開場 / 結算 / 留言板 */
.card{position:absolute; inset:0; z-index:5; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  gap:calc(var(--u)*2.4); padding:calc(var(--u)*7); background:var(--board); overflow-y:auto}
.board[data-mode="intro"] .card.intro, .board[data-mode="end"] .card.end, .board[data-mode="board"] .card.cmt{display:flex}
.card .kick{font-weight:900; font-size:calc(var(--u)*3.2); letter-spacing:.3em; background:var(--ink); color:var(--board); padding:calc(var(--u)*.8) calc(var(--u)*2.6); border-radius:99px}
.card h1{font-family:var(--round); font-weight:400; font-size:calc(var(--u)*11); line-height:1.08; margin:0; text-wrap:balance}
.card .sub{font-size:calc(var(--u)*4); font-weight:700}
.big{font-weight:900; font-size:calc(var(--u)*15); line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.big small{font-size:.38em; font-weight:700}
.rank{font-family:var(--round); font-size:calc(var(--u)*6); background:var(--ink); color:var(--board); padding:calc(var(--u)*.6) calc(var(--u)*3.6); border-radius:calc(var(--u)*2)}
.ghost{background:transparent; color:var(--ink); box-shadow:inset 0 0 0 calc(var(--u)*.6) var(--ink)}
.card.end{justify-content:flex-start; gap:calc(var(--u)*1.8); padding:calc(var(--u)*5)}
.card.end > :first-child{margin-top:auto} .card.end > :last-child{margin-bottom:auto}
.endrow{display:flex; align-items:center; gap:calc(var(--u)*3)}
.endrow .sub{font-size:calc(var(--u)*3.6)}
.ask{width:100%; display:grid; gap:calc(var(--u)*1.6); padding:calc(var(--u)*3); background:var(--paper); border:calc(var(--u)*.6) solid var(--ink);
  border-radius:calc(var(--u)*2.6); box-shadow:calc(var(--u)*.8) calc(var(--u)*.8) 0 var(--ink); text-align:left}
.ask h2{margin:0; font-family:var(--round); font-weight:400; font-size:calc(var(--u)*5)}
.ask input{width:100%; min-width:0; border:calc(var(--u)*.45) solid var(--ink); border-radius:calc(var(--u)*1.8); background:#fff; color:var(--ink);
  padding:calc(var(--u)*1.8) calc(var(--u)*2.4); font-size:calc(var(--u)*3.6); font-weight:700}
.ask .btns{display:grid; grid-template-columns:1fr 1fr; gap:calc(var(--u)*2)}
.ask .next{font-size:calc(var(--u)*3.6); padding:calc(var(--u)*2.2) calc(var(--u)*2)}
.links{display:flex; flex-wrap:wrap; justify-content:center; gap:calc(var(--u)*2)}
.links .next{font-size:calc(var(--u)*3.2); padding:calc(var(--u)*1.8) calc(var(--u)*3.6)}
body.rec .links{display:none}

.card.cmt{justify-content:flex-start; text-align:left; align-items:stretch; gap:calc(var(--u)*2); padding:calc(var(--u)*5)}
.cmt-head{display:flex; align-items:center; justify-content:space-between; gap:calc(var(--u)*2)}
.cmt-head h2{margin:0; font-family:var(--round); font-weight:400; font-size:calc(var(--u)*6)}
.preview{font-size:calc(var(--u)*2.6); font-weight:700; color:var(--soft)}
.list{flex:1; min-height:0; overflow-y:auto; display:grid; align-content:start; gap:calc(var(--u)*1.6)}
.c{background:var(--paper); border:calc(var(--u)*.45) solid var(--ink); border-radius:calc(var(--u)*2); padding:calc(var(--u)*1.8) calc(var(--u)*2.4)}
.c b{font-size:calc(var(--u)*3); display:block}
.c p{margin:calc(var(--u)*.4) 0 0; font-size:calc(var(--u)*3.4); line-height:1.4; word-break:break-word}
.c .anime{display:inline-block; margin-top:calc(var(--u)*.8); font-size:calc(var(--u)*2.6); font-weight:700; background:var(--board); border:calc(var(--u)*.3) solid var(--ink); border-radius:99px; padding:0 calc(var(--u)*1.4)}
.form{display:grid; grid-template-columns:calc(var(--u)*22) 1fr auto; gap:calc(var(--u)*1.6)}
.form input{min-width:0; border:calc(var(--u)*.45) solid var(--ink); border-radius:calc(var(--u)*1.6); background:#fff; color:var(--ink); padding:calc(var(--u)*1.6) calc(var(--u)*2); font-size:calc(var(--u)*3.2); font-weight:700}
.form .next{font-size:calc(var(--u)*3.4); padding:calc(var(--u)*1.6) calc(var(--u)*3.4)}

/* 工具列 */
.tools{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px}
.tb{border:1px solid var(--tb-line); background:var(--tb-bg); color:var(--tb-fg); border-radius:99px; padding:8px 14px; font-size:13.5px; font-weight:500}
.tb:hover{border-color:var(--tb-muted)}
.tb.on{background:var(--board); color:var(--ink); border-color:var(--board)}
.swatches{display:flex; flex-wrap:wrap; justify-content:center; gap:6px 14px; align-items:center; padding:6px 12px; border:1px solid var(--tb-line); border-radius:18px; background:var(--tb-bg)}
.swg{display:flex; gap:6px; align-items:center; font-size:12px; color:var(--tb-muted)}
.sw{width:22px; height:22px; border-radius:50%; border:2px solid var(--tb-line); padding:0}
.sw.on{outline:2px solid var(--board); outline-offset:2px}
.keys{width:100%; text-align:center; font-size:12px; color:var(--tb-muted)}
kbd{font-family:ui-monospace, Menlo, monospace; font-size:11px; border:1px solid var(--tb-line); border-radius:5px; padding:1px 5px}
body.rec .tools{display:none}
body.rec .app{grid-template-rows:1fr; padding-block:0; gap:0}
body.rec .board{border-radius:0}
body.rec .hint, body.rec .need{visibility:hidden}
.mover{position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.6); display:grid; place-items:center; padding:16px}
.mover-in{width:min(560px,100%); background:#fffaf0; color:#17140f; border-radius:16px; padding:18px; display:grid; gap:10px}
.mover-in h3{margin:0; font-size:18px}
.mover-in p{margin:0; font-size:13.5px; line-height:1.55; color:#5c5546}
.mover-in textarea{width:100%; min-height:120px; border:1px solid #d9d4c4; border-radius:10px; padding:8px; font:12px ui-monospace, Menlo, monospace; color:#17140f; background:#fff}
.mover-in .row{display:flex; flex-wrap:wrap; gap:8px}
.mover-in button{border:0; border-radius:99px; padding:9px 16px; font-weight:700; background:#17140f; color:#ffd23a}
.mover-in button.light{background:#ece7d8; color:#17140f}
.toast{position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top,0px)); transform:translateX(-50%); z-index:50; background:var(--tb-bg); color:var(--tb-fg);
  border:1px solid var(--tb-line); padding:8px 14px; border-radius:99px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>

<div class="app">
  <div class="cell">
    <div class="board" id="board" data-mode="intro">
      <div class="head">
        <div class="pill" id="prog">1 / 10</div>
        <div class="score">答對 <b id="score">0</b> 題</div>
      </div>
      <div class="main">
        <div class="pic" id="pic"></div>
        <div class="q"><div class="tags"><span class="tag cat" id="cat"></span><span class="tag" id="tag">簡單</span></div><p class="qtext" id="qtext"></p></div>
      </div>
      <div class="opts" id="opts"></div>
      <div class="foot">
        <div class="fact" id="fact"></div>
        <button class="next" id="go">揭曉答案</button>
      </div>

      <div class="card intro">
        <div class="kick" id="kicker"></div>
        <h1 id="title"></h1>
        <div class="sub" id="subtitle"></div>
        <button class="next" id="start">開始挑戰</button>
      </div>

      <div class="card end">
        <div class="endrow"><div class="big" id="final">0<small> / 20</small></div><div class="rank" id="rank"></div></div>
        <div class="sub" id="rankLine"></div>
        <div class="ask">
          <h2 id="askTitle"></h2>
          <input id="animeInput" type="text" maxlength="40" autocomplete="off">
          <div class="btns">
            <a class="next" id="copyBtn" href="#" target="_blank" rel="noopener">送出</a>
            <a class="next ghost" id="igBtn" href="#" target="_blank" rel="noopener">去 IG 找我</a>
          </div>
        </div>
        <div class="links">
          <button class="next ghost" id="boardBtn">看留言板</button>
          <button class="next ghost" id="again">再玩一次</button>
          <button class="next ghost" id="again2">換題目順序</button>
        </div>
      </div>

      <div class="card cmt">
        <div class="cmt-head"><h2>留言板</h2><button class="next ghost" id="backBtn" style="font-size:calc(var(--u)*3.2); padding:calc(var(--u)*1.6) calc(var(--u)*3.4)">← 回分數</button></div>
        <div class="preview">排版預覽：目前留言只存在這台裝置，還不會讓其他人看到</div>
        <div class="list" id="list"></div>
        <div class="form">
          <input id="cName" type="text" maxlength="16" placeholder="暱稱" autocomplete="off">
          <input id="cText" type="text" maxlength="80" placeholder="想說的話、想看的動漫…" autocomplete="off">
          <button class="next" id="cSend">送出</button>
        </div>
      </div>
    </div>
  </div>
  <div class="tools">
    <button class="tb" id="recBtn">錄影模式</button>
    <button class="tb" id="shuffleBtn">打亂題目</button>
    <button class="tb" id="restartBtn">重新開始</button>
    <button class="tb" id="imgBtn">放照片</button>
    <button class="tb" id="moveBtn">搬照片到別台電腦</button>
    <button class="tb" id="themeBtn">顏色</button>
    <div class="swatches" id="swatches" hidden></div>
    <div class="keys"><kbd>1</kbd>–<kbd>4</kbd> 選答案 · <kbd>Space</kbd> 揭曉 / 下一題 · <kbd>→</kbd> 下一題 · <kbd>←</kbd> 上一題 · <kbd>R</kbd> 錄影模式 · <kbd>Esc</kbd> 離開</div>
  </div>
</div>
<input type="file" id="file" accept="image/*" hidden>
<div class="mover" id="mover" hidden>
  <div class="mover-in">
    <h3>搬照片到別台電腦</h3>
    <p><b>在有照片的電腦：</b>按「匯出照片」，會把所有照片複製成一串文字。把它貼到 LINE 傳給自己，或貼到記事本存起來。</p>
    <p><b>在新的電腦：</b>打開這個頁面，按這個按鈕，把那串文字貼到下面，再按「匯入照片」。</p>
    <textarea id="moveText" spellcheck="false" placeholder="在新電腦把文字貼在這裡"></textarea>
    <div class="row">
      <button id="exportBtn">匯出照片</button>
      <button id="importBtn">匯入照片</button>
      <button class="light" id="moveClose">關閉</button>
    </div>
    <p id="moveNote"></p>
  </div>
</div>
<div class="toast" id="toast"></div>

  {type:"烏野", difficulty:'easy', question:"第一集裡，原本想把日向挖走的是哪個社團？", options:["籃球社", "田徑社", "足球社", "跳高社"], correct_answer:"籃球社", explanation:"日向個子小但彈跳力驚人，籃球社早就盯上他了。"},
  {type:"西谷", difficulty:'easy', question:"西谷當初選擇讀烏野的理由是什麼？", options:["女生制服很好看", "離家最近", "想跟旭當隊友", "烏野排球很強"], correct_answer:"女生制服很好看", explanation:"理由超單純，完全是西谷會做的事。"},
  {type:"谷地", difficulty:'medium', question:"谷地第一次站在清水學姐旁邊，心裡最擔心什麼？", options:["自己會不會被暗殺", "學姐會不會討厭她", "會不會被叫去倒茶", "自己太矮會被笑"], correct_answer:"自己會不會被暗殺", explanation:"學姐實在太漂亮，她腦內小劇場覺得站在旁邊可能會被暗殺。"},
  {type:"日向", difficulty:'hard', question:"日向國中所有「正式比賽」加起來，總共打了多久？", options:["31 分鐘", "1 小時", "3 小時", "8 分鐘"], correct_answer:"31 分鐘", explanation:"國中三年只打過一場正式比賽，一下就被北川第一打完了。"},
  {type:"期末考", difficulty:'hard', question:"日向英文考了幾分，差點不能去東京集訓？", options:["21 分", "8 分", "38 分", "52 分"], correct_answer:"21 分", explanation:"影山也沒好到哪去，國文只拿 38 分，兩個一起被抓去補考。"},
  {type:"影山", difficulty:'medium', question:"影山很常穿的那件 T 恤上，寫著哪幾個字？", options:["二傳魂", "排球命", "王者", "天才"], correct_answer:"二傳魂", explanation:"衣服品味跟他本人一樣直球。"},
  {type:"日向", difficulty:'medium', question:"日向幫北川第一的金田一取了什麼綽號？", options:["蕗蕎頭", "洋蔥頭", "刺蝟頭", "香菇頭"], correct_answer:"蕗蕎頭", explanation:"因為他的髮型尖尖的，長得很像蕗蕎。"},
  {type:"影山", difficulty:'medium', question:"影山國中被叫「球場上的王者」，最慘的那一幕是什麼？", options:["他托出去的球，沒有任何隊友去扣", "他在決賽發球失誤", "他被教練換下場罵哭", "他把球打到觀眾席"], correct_answer:"他托出去的球，沒有任何隊友去扣", explanation:"隊友受不了他的獨裁，整場比賽就這樣被放生，這也是他最大的陰影。"},
  {type:"烏野", difficulty:'medium', question:"入社第一天，澤村隊長為什麼把日向和影山趕出體育館？", options:["兩個人一直吵架，不肯當隊友", "遲到太久", "把球打到校長", "沒穿運動服"], correct_answer:"兩個人一直吵架，不肯當隊友", explanation:"隊長說等他們學會合作再回來，兩人只好偷偷在外面練球。"},
  {type:"伊達工業", difficulty:'medium', question:"伊達工業的應援布條上寫著什麼？", options:["伊達的鐵壁", "伊達的高塔", "伊達的城牆", "伊達的盾牌"], correct_answer:"伊達的鐵壁", explanation:"名不虛傳，烏野的旭在這面牆前面被擋到失去信心。"},
];
/* 沒有圖片時，題目左邊的方塊顯示的字（依 type） */
const GLYPH = {"烏野": "烏", "西谷": "守", "谷地": "谷", "日向": "日", "期末考": "考", "影山": "影", "角色煩惱": "煩", "伊達工業": "鐵", "看圖猜角色": "？"};
const LEVEL = {easy:'簡單', medium:'中等', hard:'困難'};

/* ==========================================================
   以下是遊戲引擎，換主題不用改
   ========================================================== */
const $ = id => document.getElementById(id);
const board = $('board');
const LS = 'quizengine.' + QUIZ.title;
const store = { get(k){ try{ return JSON.parse(localStorage.getItem(LS + '.' + k)); }catch(e){ return null; } }, set(k, v){ try{ localStorage.setItem(LS + '.' + k, JSON.stringify(v)); }catch(e){} } };
QUESTIONS.forEach((q, i) => { q.id ||= 'q' + (i + 1); q.image ||= (typeof EMBEDDED_IMAGES === 'object' && EMBEDDED_IMAGES[i + 1]) || ''; });
let deck = [], idx = -1, picks = {}, revealed = {}, rec = false, before = 'end';

/* 上傳的圖片存在 IndexedDB（只在這個瀏覽器） */
let dbP; const urls = {};
const imgMap = store.get('imgs') || {};
function db(){ return dbP ||= new Promise((res, rej) => { const r = indexedDB.open(LS, 1); r.onupgradeneeded = () => r.result.createObjectStore('img'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function tx(mode, fn){ const d = await db(); return new Promise((res, rej) => { const t = d.transaction('img', mode); const q = fn(t.objectStore('img')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); }
async function hydrate(){ await Promise.all(Object.values(imgMap).map(async k => { try{ const b = await tx('readonly', s => s.get(k)); if(b) urls[k] = URL.createObjectURL(b); }catch(e){} })); }
const failed = new Set();
const imgOf = q => { const u = urls[imgMap[q.id]] || q.image || ''; return failed.has(u) ? '' : u; };
const keep = []; function preload(u){ if(!u) return; const i = new Image(); i.src = u; i.onerror = () => { failed.add(u); }; keep.push(i); if(keep.length > 8) keep.shift(); }

function rankFor(s, n){ return [...QUIZ.ranks].reverse().find(([t]) => n && s / n >= t) || QUIZ.ranks[0]; }
const score = () => deck.reduce((s, q, i) => s + (revealed[i] && q.options[picks[i]] === q.correct_answer ? 1 : 0), 0);
function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function build(mix){
  let qs = QUESTIONS.filter(q => !rec || !q.needs_image || imgOf(q));
  if(mix){
    qs = shuffle([...qs]);
    const e = qs.findIndex(q => q.difficulty === 'easy'); if(e > 0) [qs[0], qs[e]] = [qs[e], qs[0]];
    qs = qs.map(q => q.options.length > 2 && !q.keep_order && q.type !== '時間順序' ? {...q, options: shuffle([...q.options])} : q);
  }
  deck = qs; idx = -1; picks = {}; revealed = {}; render();
}

function render(){
  const n = deck.length;
  if(board.dataset.mode !== 'board') board.dataset.mode = idx < 0 ? 'intro' : idx >= n ? 'end' : 'play';
  $('score').textContent = score();
  if(idx >= n){
    const s = score(), r = rankFor(s, n);
    $('final').innerHTML = `${s}<small> / ${n}</small>`; $('rank').textContent = r[1]; $('rankLine').textContent = r[2];
    return;
  }
  if(idx < 0){ if(deck[0]) preload(imgOf(deck[0])); return; }
  const q = deck[idx], rv = !!revealed[idx], pk = picks[idx];
  board.classList.toggle('done', rv);
  $('prog').textContent = `${idx + 1} / ${n}`;
  $('cat').textContent = q.type; $('tag').textContent = LEVEL[q.difficulty] || '';
  $('qtext').textContent = q.question;
  const u = imgOf(q), pic = $('pic');
  if(u){ pic.innerHTML = '<img alt="">'; const im = pic.firstChild; im.onerror = () => { failed.add(u); render(); }; im.src = u; }
  else pic.innerHTML = `<span class="glyph">${GLYPH[q.type] || '?'}</span>${q.needs_image ? '<span class="need">點這個框框放照片</span>' : ''}`;
  pic.classList.toggle('editable', !rec);
  if(!rec) pic.insertAdjacentHTML('beforeend', `<span class="swap">${u ? '點一下換照片' : '點一下放照片'}</span>`);
  pic.title = rec ? '' : (u ? '點一下換照片（右鍵移除）' : '點一下放照片');
  $('opts').innerHTML = q.options.map((t, i) => {
    let c = !rv && pk === i ? 'pick' : '';
    if(rv) c = t === q.correct_answer ? 'right' : pk === i ? 'wrong' : '';
    return `<button class="opt ${c}" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span class="t">${t}</span></button>`;
  }).join('');
  if(!rv){ $('fact').innerHTML = `<span class="hint">${pk === undefined ? '選一個答案' : '確定了嗎？'}</span>`; $('go').textContent = '揭曉答案'; }
  else {
    const ok = q.options[pk] === q.correct_answer;
    $('fact').innerHTML = `<strong>${pk === undefined ? '答案是 ' + 'ABCD'[q.options.indexOf(q.correct_answer)] : ok ? '答對了！' : '答案是 ' + 'ABCD'[q.options.indexOf(q.correct_answer)]}</strong>${q.explanation || ''}`;
    $('go').textContent = idx === n - 1 ? '看結果 →' : '下一題 →';
  }
  const nx = deck[idx + 1]; if(nx) preload(imgOf(nx));
}
function pick(i){ if(board.dataset.mode !== 'play' || revealed[idx]) return; if(i >= deck[idx].options.length) return; picks[idx] = picks[idx] === i ? undefined : i; render(); }
function reveal(){
  const m = board.dataset.mode;
  if(m === 'intro'){ idx = 0; render(); return; }
  if(m !== 'play') return;
  if(!revealed[idx]){ revealed[idx] = true; render(); } else next();
}
function next(){ if(board.dataset.mode === 'play' && idx < deck.length){ idx++; render(); } }
function prev(){ if(board.dataset.mode === 'play' && idx > 0){ idx--; render(); } else if(board.dataset.mode === 'end'){ idx = deck.length - 1; render(); } }

/* 開場文字 */
$('kicker').textContent = QUIZ.kicker; $('title').textContent = QUIZ.title; $('subtitle').textContent = QUIZ.subtitle;
$('askTitle').textContent = QUIZ.askTitle; $('animeInput').placeholder = QUIZ.askPlaceholder;
$('igBtn').href = INSTAGRAM_URL;

/* 事件 */
$('opts').addEventListener('click', e => { const b = e.target.closest('.opt'); if(b) pick(+b.dataset.i); });
$('go').onclick = reveal; $('start').onclick = reveal;
$('again').onclick = () => build(false); $('again2').onclick = () => { build(true); toast('已打亂順序，第一題固定是簡單題'); };
$('shuffleBtn').onclick = $('again2').onclick; $('restartBtn').onclick = () => build(false);
const FORM_READY = !!(FORM_URL && FORM_ENTRY);
if(!FORM_READY) $('copyBtn').textContent = '複製答案';
function formLink(v){ const u = new URL(FORM_URL); u.searchParams.set('usp', 'pp_url'); u.searchParams.set(FORM_ENTRY, v); return u.toString(); }
$('animeInput').addEventListener('input', () => { if(FORM_READY) $('copyBtn').href = formLink($('animeInput').value.trim()); });
$('copyBtn').onclick = async e => {
  const v = $('animeInput').value.trim();
  if(!v){ e.preventDefault(); toast('先輸入你還想玩的挑戰'); $('animeInput').focus(); return; }
  if(FORM_READY){ $('copyBtn').href = formLink(v); toast('在表單按「提交」就完成了，謝謝！'); return; }
  e.preventDefault();
  const text = QUIZ.copyPrefix + v;
  try{ await navigator.clipboard.writeText(text); toast('已複製！可以去 IG 私訊我'); }
  catch(e){ $('animeInput').value = text; $('animeInput').select(); toast('已選取，按 Ctrl/⌘ C 複製'); }
};

/* 留言板（排版預覽：存在本機） */
const SAMPLE = [{n:'範例・阿明', t:'下一集可以做咒術迴戰嗎！', a:'咒術迴戰'}, {n:'範例・小美', t:'我只錯兩題，會長級在這', a:''}];
function drawList(){
  const mine = store.get('comments') || [];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  $('list').innerHTML = [...mine].reverse().concat(SAMPLE).map(c => `<div class="c"><b>${esc(c.n)}</b><p>${esc(c.t)}</p>${c.a ? `<span class="anime">想看：${esc(c.a)}</span>` : ''}</div>`).join('');
}
$('boardBtn').onclick = () => { board.dataset.mode = 'board'; drawList(); };
$('backBtn').onclick = () => { board.dataset.mode = 'end'; render(); };
$('cSend').onclick = () => {
  const t = $('cText').value.trim(); if(!t){ toast('先寫點什麼吧'); return; }
  const mine = store.get('comments') || []; mine.push({n: $('cName').value.trim() || '匿名', t, a: $('animeInput').value.trim()});
  store.set('comments', mine.slice(-50)); $('cText').value = ''; drawList(); toast('已送出（目前只有你看得到）');
};

/* 上傳圖片 */
$('pic').addEventListener('click', () => { if(!rec && board.dataset.mode === 'play') $('file').click(); });
$('pic').addEventListener('contextmenu', e => {
  if(rec || board.dataset.mode !== 'play') return; const q = deck[idx]; if(!imgMap[q.id]) return;
  e.preventDefault(); tx('readwrite', s => s.delete(imgMap[q.id])).catch(() => {}); delete imgMap[q.id]; store.set('imgs', imgMap); render(); toast('已移除這題的照片');
});
/* 搬照片：匯出成一串文字，到別台電腦貼上匯入 */
$('moveBtn').onclick = () => { $('mover').hidden = false; $('moveNote').textContent = `這台電腦目前有 ${Object.keys(imgMap).length} 題放了照片。`; };
$('moveClose').onclick = () => { $('mover').hidden = true; };
const blobToData = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
$('exportBtn').onclick = async () => {
  const out = {};
  for(const [qid, key] of Object.entries(imgMap)){ try{ const b = await tx('readonly', s => s.get(key)); if(b) out[qid] = await blobToData(b); }catch(e){} }
  const n = Object.keys(out).length; if(!n){ toast('這台電腦還沒有放任何照片'); return; }
  const text = 'QUIZPHOTOS:' + JSON.stringify(out);
  $('moveText').value = text; $('moveText').select();
  try{ await navigator.clipboard.writeText(text); $('moveNote').textContent = `已複製 ${n} 張照片（約 ${(text.length / 1048576).toFixed(1)} MB 的文字）。貼到 LINE 或記事本，帶到新電腦。`; }
  catch(e){ $('moveNote').textContent = `已選取 ${n} 張照片的文字，請按 Ctrl/⌘ C 複製。`; }
};
$('importBtn').onclick = async () => {
  const raw = $('moveText').value.trim();
  if(!raw.startsWith('QUIZPHOTOS:')){ toast('貼上的文字不對，請貼「匯出照片」複製出來的整串'); return; }
  let data; try{ data = JSON.parse(raw.slice(11)); }catch(e){ toast('文字不完整，可能沒有複製到全部，請再匯出一次'); return; }
  let n = 0;
  for(const [qid, url] of Object.entries(data)){
    try{
      const blob = await (await fetch(url)).blob(); const key = 'i' + Date.now() + n;
      await tx('readwrite', s => s.put(blob, key));
      if(imgMap[qid]) tx('readwrite', s => s.delete(imgMap[qid])).catch(() => {});
      urls[key] = URL.createObjectURL(blob); imgMap[qid] = key; n++;
    }catch(e){}
  }
  store.set('imgs', imgMap); render();
  $('moveNote').textContent = `匯入完成：${n} 張照片。`; toast(`已匯入 ${n} 張照片`);
};
$('imgBtn').onclick = () => { if(board.dataset.mode !== 'play'){ toast('先開始遊戲，到要放圖的那一題再按'); return; } $('file').click(); };
$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f || !f.type.startsWith('image/')) return;
  const q = deck[idx]; const key = 'i' + Date.now();
  try{
    const b = await createImageBitmap(f); const k = Math.min(1, 1200 / Math.max(b.width, b.height)); const c = document.createElement('canvas');
    c.width = Math.round(b.width * k); c.height = Math.round(b.height * k); c.getContext('2d').drawImage(b, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .88));
    await tx('readwrite', s => s.put(blob, key)); urls[key] = URL.createObjectURL(blob);
    if(imgMap[q.id]) tx('readwrite', s => s.delete(imgMap[q.id])).catch(() => {});
    imgMap[q.id] = key; store.set('imgs', imgMap); render(); toast('已放上這題的圖片');
  }catch(err){ toast('圖片讀取失敗，換一張試試'); }
});

/* 卡片顏色：題目卡片本身的顏色（文字一律深色，所以只放淺色系） */
const CARDS = [
  {name:'烏野橘', board:'#ff9a3c'},
  {name:'黃色', board:'#ffd23a'},
  {name:'白色', board:'#fffaf0'},
  {name:'粉紅', board:'#ffb8cb'},
  {name:'薄荷', board:'#a8e6c9'},
  {name:'天藍', board:'#a9d8ff'},
  {name:'橘色', board:'#ffa95c'},
  {name:'淺紫', board:'#cdb6ff'},
];
function applyCard(i){
  const c = CARDS[i] || CARDS[0], r = document.documentElement.style;
  r.setProperty('--board', c.board);
  r.setProperty('--paper', c.board === '#fffaf0' ? '#ffffff' : '#fffaf0');
  [...document.querySelectorAll('.sw[data-c]')].forEach(b => b.classList.toggle('on', +b.dataset.c === i));
  store.set('card', i);
}
/* 背景色 */
function applyTheme(i){
  const t = THEMES[i] || THEMES[0], r = document.documentElement.style;
  r.setProperty('--page', t.page);
  r.setProperty('--tb-bg', t.light ? '#ffffff' : 'rgba(255,255,255,.07)');
  r.setProperty('--tb-line', t.light ? '#d9d4c4' : 'rgba(255,255,255,.16)');
  r.setProperty('--tb-fg', t.light ? '#17140f' : '#fffaf0');
  r.setProperty('--tb-muted', t.light ? '#6f6852' : 'rgba(255,250,240,.6)');
  document.documentElement.style.colorScheme = t.light ? 'light' : 'dark';
  [...document.querySelectorAll('.sw[data-i]')].forEach(b => b.classList.toggle('on', +b.dataset.i === i));
  store.set('theme', i);
}
$('swatches').innerHTML =
  `<div class="swg">卡片 ${CARDS.map((c, i) => `<button class="sw" style="background:${c.board}" data-c="${i}" title="卡片：${c.name}" aria-label="卡片：${c.name}"></button>`).join('')}</div>` +
  `<div class="swg">背景 ${THEMES.map((t, i) => `<button class="sw" style="background:${t.page}" data-i="${i}" title="背景：${t.name}" aria-label="背景：${t.name}"></button>`).join('')}</div>`;
$('swatches').onclick = e => { const b = e.target.closest('.sw'); if(!b) return; if(b.dataset.c != null) applyCard(+b.dataset.c); else applyTheme(+b.dataset.i); };
applyCard(store.get('card') ?? 0);
$('themeBtn').onclick = () => { const s = $('swatches'); s.hidden = !s.hidden; $('themeBtn').classList.toggle('on', !s.hidden); };
applyTheme(store.get('theme') ?? 0);

/* 錄影模式 */
function setRec(on){ rec = on; document.body.classList.toggle('rec', on); $('recBtn').classList.toggle('on', on);
  if(on){ toast('錄影模式：按 Esc 或連點三下題號離開'); if(board.dataset.mode === 'intro') build(false); } }
$('recBtn').onclick = () => setRec(!rec);
let taps = []; $('prog').addEventListener('click', () => { const t = Date.now(); taps = taps.filter(x => t - x < 700); taps.push(t); if(taps.length >= 3 && rec){ taps = []; setRec(false); } });

document.addEventListener('keydown', e => {
  if(/INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if(['1','2','3','4'].includes(k)) pick(+k - 1);
  else if(e.code === 'Space'){ e.preventDefault(); reveal(); }
  else if(k === 'arrowright'){ e.preventDefault(); if(board.dataset.mode === 'play' && revealed[idx]) next(); else if(board.dataset.mode === 'play') next(); }
  else if(k === 'arrowleft'){ e.preventDefault(); prev(); }
  else if(k === 'r') setRec(!rec);
  else if(k === 'escape' && rec) setRec(false);
});
document.querySelectorAll('button').forEach(b => b.addEventListener('keydown', e => { if(e.code === 'Space') e.preventDefault(); }));
let tt; function toast(m){ const el = $('toast'); el.textContent = m; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2200); }

build(false);
hydrate().then(render);
</script>
</body>
